name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create plugin ZIP
        run: |
          cd dist
          zip -r ../memos-sync.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: memos-sync-zip
          path: memos-sync.zip

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: memos-sync-dist
          path: dist/

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: memos-sync.zip
